    <style>
        body {
            margin: 0;

        img {
            max-width: 100%;

<body>
    <img src="main.jpg" alt="temporary page" onclick="exitpage()">
    <script>
        function getApplicationDevice() {
            var userAgent = navigator.userAgent || navigtor.vendor || window.opera;
            
            if (/kona-application-android/i.test(userAgent)) {
                return 'Android'
            }
            
            if (/kona-application-ios/.test(userAgent)) {
                return 'iOS';
            }
            
            return 'Not Application';
        }

        var device = getApplicationDevice();
        
        function exitpage() {
            if ('Android'== device) {
                KonaCard.exit();
            } 
            else if ('iOS'== device) {
                window.webkit.messageHandlers.exit.postMessage(null);
            }
        }
    </script>
</body>
</html>
